[package]
name = "clipboard-manager"
version = "0.1.1"
description = "Hafif, Windows'a özel pano geçmişi yöneticisi"
edition = "2021"

[lib]
name = "clipboard_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# SQLite statik olarak gömülür; sistemde sqlite3.dll gerekmez.
rusqlite = { version = "0.32", features = ["bundled"] }
# Pano okuma/yazma (metin, görsel, dosya listesi).
arboard = { version = "3.4", default-features = false, features = ["image-data"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[dependencies.windows]
version = "0.61"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
