# v* etiketi push'landığında Windows kurulum dosyasını derleyip GitHub Release olarak yayınlar.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Clipboard Manager ${{ github.ref_name }}
          releaseBody: Kurulum için aşağıdaki `-setup.exe` dosyasını indirin.
          releaseDraft: false
          prerelease: false

      # Kurulumsuz exe; sabit ad sayesinde site /releases/latest/download/ ile bağlanabilir.
      - name: Upload portable exe
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp src-tauri/target/release/clipboard-manager.exe ClipboardManager-portable.exe
          gh release upload "${{ github.ref_name }}" ClipboardManager-portable.exe --clobber
